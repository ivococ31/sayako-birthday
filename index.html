<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10102b"><title>さやこへ | Happy Birthday</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif;background:radial-gradient(ellipse at 50% 10%,#40306d 0%,#171431 45%,#090b1e 100%);overflow-x:hidden}.sky{position:fixed;inset:0;pointer-events:none;z-index:0}.star{position:absolute;width:2px;height:2px;border-radius:50%;background:white;animation:twinkle 2s infinite alternate}@keyframes twinkle{to{opacity:.2;transform:scale(.5)}}.moon{position:fixed;right:9%;top:7%;width:86px;height:86px;border-radius:50%;background:#fff2d4;box-shadow:0 0 55px #fff1c48c;opacity:.85}.wrap{position:relative;z-index:1;max-width:680px;margin:auto;padding:65px 22px 90px;text-align:center}h1{font-size:clamp(2.2rem,8vw,4rem);line-height:1.25;margin:14px 0;color:#ffe4f3;text-shadow:0 0 25px #ff8bd577}.small{letter-spacing:.25em;color:#d7c8ff;font-size:.78rem}.glass{margin:30px auto;padding:28px 24px;border:1px solid #ffffff42;border-radius:25px;background:#ffffff12;backdrop-filter:blur(12px);box-shadow:0 18px 60px #0004}.gift{font-size:95px;display:block;margin:10px auto;filter:drop-shadow(0 0 20px #ff8bdb);animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px)}}button{border:0;border-radius:999px;padding:15px 27px;margin:12px 6px;background:linear-gradient(120deg,#ff94ca,#b49cff);color:#211637;font-weight:800;font-size:1rem;cursor:pointer;box-shadow:0 6px 25px #ff8ac055}button:hover{transform:translateY(-2px)}button:focus-visible{outline:3px solid white;outline-offset:3px}.hidden{display:none}.letter{line-height:2.15;font-size:1.05rem;white-space:pre-line}.cake{font-size:90px;margin:15px 0}.footer{color:#cfc5e7;font-size:.9rem}.heart{position:fixed;z-index:5;pointer-events:none;animation:rise 3s linear forwards}@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><div class="sky" id="sky" aria-hidden="true"></div><div class="moon" aria-hidden="true"></div><main class="wrap"><p class="small">A LITTLE SURPRISE FOR YOU</p><h1>Happy Birthday<br>さやこ 🎀</h1><p>今日は、さやこの特別な日。</p><section class="glass" id="first"><span class="gift" aria-hidden="true">🎁</span><h2>さやこへ、プレゼントがあるよ</h2><p>下のボタンを押してみてね ♡</p><button id="open">プレゼントを開ける ✨</button></section><section class="glass hidden" id="second" aria-live="polite"><div class="cake" aria-hidden="true" id="cake">🎂</div><h2>お誕生日おめでとう！</h2><p class="letter">さやこ、お誕生日おめでとう。\nいつも一緒にいてくれてありがとう。\nさやこと過ごす時間は、僕にとって大切な宝物です。\nこれからの一年が、笑顔の多い素敵な一年になりますように。\nこれからも、たくさん楽しい思い出を作ろうね。</p><p>— イフォより 💜</p><button id="wish">願いごとをする 🌟</button><p id="wishtext" class="hidden">さやこの願いが叶いますように ✨</p></section><p class="footer">Made with love, just for Sayako ♡</p></main><script>
const sky=document.getElementById('sky');for(let i=0;i<95;i++){const s=document.createElement('i');s.className='star';s.style.left=(i*73.73%100)+'%';s.style.top=(i*39.17%100)+'%';s.style.opacity=.25+(i%7)/10;s.style.animationDelay=(i%11)*.27+'s';sky.append(s)}function hearts(n=22){for(let i=0;i<n;i++){const h=document.createElement('span');h.className='heart';h.textContent=['💜','🌸','✨','💗'][i%4];h.style.left=Math.random()*95+'vw';h.style.top='105vh';h.style.fontSize=(16+Math.random()*20)+'px';h.style.animationDelay=Math.random()*1.3+'s';document.body.append(h);setTimeout(()=>h.remove(),4600)}}document.getElementById('open').addEventListener('click',()=>{document.getElementById('first').classList.add('hidden');document.getElementById('second').classList.remove('hidden');hearts(28)});document.getElementById('wish').addEventListener('click',()=>{document.getElementById('wishtext').classList.remove('hidden');document.getElementById('cake').textContent='🍰';hearts(35)});
</script></body></html>
