<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1c0a2d"><title>Sayako · Birthday Story 🎂</title><style>
:root{font-family:'Yu Gothic','Hiragino Kaku Gothic ProN',system-ui,sans-serif;color:#fff;background:#100719}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 15%,#5b266d,#100719 75%);overflow-x:hidden}.layout{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:14px}.frame{width:min(100%,1050px);position:relative;border:2px solid #bd8dca;border-radius:18px;overflow:hidden;box-shadow:0 18px 65px #000b,0 0 40px #bd61b54d;background:#190c28}.scene{display:none;position:relative;animation:appear .7s ease both}.scene.active{display:block}.art{width:100%;display:block;aspect-ratio:3/2;object-fit:cover}.veil{position:absolute;inset:0;pointer-events:none;background:linear-gradient(transparent 70%,#11051e88)}.hotspot{position:absolute;cursor:pointer;border:0;background:transparent;z-index:2}.hotspot:focus-visible{outline:3px solid #fff;border-radius:14px}.welcomeHot{left:68%;top:75%;width:30%;height:23%}.giftHot{left:55%;top:75%;width:43%;height:23%}.cakeHot{left:33%;top:75%;width:48%;height:21%}.controls{width:min(100%,1050px);display:flex;justify-content:space-between;align-items:center;gap:12px}.btn{font-size:clamp(14px,2.4vw,19px);font-weight:700;color:#fff;background:linear-gradient(135deg,#67205f,#9a276d);border:1px solid #eab3d8;border-radius:13px;padding:12px 20px;box-shadow:0 4px 16px #0008;cursor:pointer;min-height:48px}.btn:hover{filter:brightness(1.2)}.btn:disabled{opacity:.35;cursor:not-allowed}.counter{font-size:14px;color:#efd3ed;letter-spacing:.1em}.hint{text-align:center;font-size:13px;color:#f6d9ee;min-height:20px}.modal{position:fixed;inset:0;z-index:10;background:#100519db;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(7px)}.modal.open{display:flex}.paper{position:relative;max-width:620px;width:100%;max-height:85svh;overflow:auto;background:linear-gradient(140deg,#fff7e9,#ffe3e6);color:#5a293c;border:6px double #dca5ad;border-radius:12px;padding:clamp(22px,5vw,42px);box-shadow:0 15px 70px #0009;line-height:2;animation:unfold .65s ease both}.paper h2{margin:0 0 12px;color:#a04774}.paper p{white-space:pre-line}.close{position:absolute;right:8px;top:8px;border:0;background:#82285b;color:#fff;border-radius:50%;width:36px;height:36px;font-size:23px;cursor:pointer}.petal{position:fixed;top:-30px;z-index:20;pointer-events:none;animation:fall linear forwards;color:#f8b5d7;text-shadow:0 0 10px #fff}.wish{position:absolute;inset:0;display:none;place-items:center;background:#18091ad6;z-index:3;text-align:center;padding:20px}.wish.show{display:grid;animation:appear .6s ease}.wish h2{font-size:clamp(24px,5vw,44px);color:#ffe0f4;text-shadow:0 0 16px #ec7fd5}.wish p{line-height:1.8}.music{position:fixed;top:12px;right:12px;z-index:4;background:#351a48b9;border:1px solid #c88aba;border-radius:100px;padding:8px 12px;color:white;font-size:12px}.progress{width:min(100%,1050px);height:5px;background:#472a50;border-radius:8px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#d68cdd,#ffd7a2);transition:width .4s}.tiny{font-size:11px;color:#bfa4c4;text-align:center}@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes unfold{from{opacity:0;transform:scale(.83) rotate(-2deg)}to{opacity:1;transform:scale(1) rotate(0)}}@keyframes fall{to{transform:translate(90px,110vh) rotate(550deg);opacity:0}}@media(max-width:600px){.layout{padding:8px;gap:10px}.frame{border-radius:12px}.controls{gap:6px}.btn{padding:10px 13px}.hint{font-size:12px}.music{position:static;align-self:flex-end}.paper{padding:20px}}
</style></head><body><main class="layout"><div class="music">🌸 Sayako Birthday</div><div class="frame">
<section class="scene active" data-step="0"><img class="art" src="assets/welcome.webp" alt="Sayako birthday welcome with chibi Tanjiro under a moonlit Japanese sky"><div class="veil"></div><button class="hotspot welcomeHot" onclick="next()" aria-label="Start the birthday story"></button></section>
<section class="scene" data-step="1"><img class="art" src="assets/gift.webp" alt="Tanjiro and friends bringing Sayako a birthday present"><div class="veil"></div><button class="hotspot giftHot" onclick="openGift()" aria-label="Open the birthday gift"></button></section>
<section class="scene" data-step="2"><img class="art" src="assets/letter.webp" alt="Birthday letter for Sayako brought by anime characters"><div class="veil"></div><button class="hotspot" style="inset:10% 19% 15% 20%" onclick="openLetter()" aria-label="Read the special letter"></button></section>
<section class="scene" data-step="3"><img class="art" src="assets/cake.webp" alt="Birthday cake and anime friends celebrating Sayako"><div class="veil"></div><button class="hotspot cakeHot" onclick="blowCandles()" aria-label="Blow out birthday candles"></button><div class="wish" id="wish"><div><h2>🎉 お誕生日おめでとう、Sayako！</h2><p>これからも、たくさん笑って<br>素敵な思い出を作っていこうね。<br>いつもありがとう。💜</p><strong>イフォより</strong><p><button class="btn" onclick="restart()">もう一度見る ↻</button></p></div></div></section>
</div><div class="progress"><div id="bar" style="width:25%"></div></div><nav class="controls"><button class="btn" id="prev" onclick="previous()" disabled>◀ 戻る</button><span class="counter" id="count">01 / 04</span><button class="btn" id="action" onclick="act()">Start ▶</button></nav><div class="hint" id="hint">炭治郎と一緒に、特別な物語を始めよう 🌙</div><div class="tiny">Made with love for Sayako · イフォ</div></main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" onclick="if(event.target===this)closeModal()"><div class="paper"><button class="close" onclick="closeModal()" aria-label="Close">×</button><h2 id="modalTitle"></h2><p id="modalText"></p><button class="btn" id="modalNext" onclick="closeModal();next()">次へ ▶</button></div></div>
<script>
let step=0,blown=false;const scenes=[...document.querySelectorAll('.scene')],hints=['炭治郎と一緒に、特別な物語を始めよう 🌙','プレゼントをタップして開けてね 🎁','手紙をタップして読んでね 💌','ケーキをタップして、ろうそくを吹き消そう 🎂'];function show(i){step=Math.max(0,Math.min(3,i));scenes.forEach((s,j)=>s.classList.toggle('active',j===step));document.getElementById('bar').style.width=(step+1)*25+'%';document.getElementById('count').textContent='0'+(step+1)+' / 04';document.getElementById('prev').disabled=step===0;document.getElementById('action').textContent=['Start ▶','🎁 開ける','💌 手紙を読む','🕯️ 吹き消す'][step];document.getElementById('hint').textContent=hints[step];window.scrollTo({top:0,behavior:'smooth'})}function next(){show(step+1);petals(12)}function previous(){show(step-1)}function act(){[next,openGift,openLetter,blowCandles][step]()}function popup(title,msg){document.getElementById('modalTitle').textContent=title;document.getElementById('modalText').textContent=msg;document.getElementById('modal').classList.add('open');document.getElementById('modalNext').focus()}function closeModal(){document.getElementById('modal').classList.remove('open')}function openGift(){petals(35);popup('🎁 Sayakoへ','今日は特別な日！\n炭治郎たちから、心を込めたプレゼントだよ。\nそして、イフォから伝えたい言葉があります。💜')}function openLetter(){petals(18);popup('💌 Sayakoへ','お誕生日おめでとう！\n\nいつも優しくしてくれて、一緒に過ごす時間がとても幸せです。\nSayakoの笑顔を見ると、僕も自然と笑顔になります。\n\nこれからも、たくさん笑って、いろんな思い出を一緒に作っていけたら嬉しいです。\n\nこの一年が、Sayakoにとって健康で幸せな、素敵な一年になりますように。\n\nいつもありがとう。\n\nイフォより 💜')}function blowCandles(){if(blown)return;blown=true;document.getElementById('wish').classList.add('show');petals(70);document.getElementById('action').textContent='↻ もう一度';document.getElementById('action').onclick=restart}function restart(){blown=false;document.getElementById('wish').classList.remove('show');document.getElementById('action').onclick=act;show(0)}function petals(n){for(let i=0;i<n;i++){const p=document.createElement('span');p.className='petal';p.textContent=['🌸','✦','💗','✿'][Math.floor(Math.random()*4)];p.style.left=Math.random()*100+'vw';p.style.fontSize=(12+Math.random()*18)+'px';p.style.animationDuration=(3+Math.random()*3)+'s';p.style.animationDelay=Math.random()*.9+'s';document.body.appendChild(p);setTimeout(()=>p.remove(),7000)}}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(document.getElementById('modal').classList.contains('open'))return;if(e.key==='ArrowRight')act();if(e.key==='ArrowLeft')previous()});
</script></body></html>
